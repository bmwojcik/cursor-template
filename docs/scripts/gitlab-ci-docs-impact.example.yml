# Merge into the project's GitLab CI when Docs impact is ci.
# Soft fail first; set allow_failure: false when the team is ready to block.

docs:impact:
  stage: test
  image: python:3.12-alpine
  allow_failure: true
  needs: []
  only:
    - merge_requests
  variables:
    GIT_STRATEGY: "clone"
    GIT_DEPTH: "0"
  before_script:
    - apk add --no-cache git
    - git fetch --no-tags origin "${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}"
  script:
    - python3 docs/ci/docs-impact.py --base "${CI_MERGE_REQUEST_DIFF_BASE_SHA:-origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}}"
    - python3 docs/ci/notes-append-only.py --base "${CI_MERGE_REQUEST_DIFF_BASE_SHA:-origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}}"
